jenkins:
  # Podstawowe ustawienia serwera
  systemMessage: "Jenkins zarządzany automatycznie przez JCasC (Configuration as Code)"
  numExecutors: 4  # Liczba równoległych wykonawców na masterze
  mode: NORMAL
  scmCheckoutRetryCount: 2
  
  # Globalne ustawienia bezpieczeństwa (podstawowe)
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "${ADMIN_PASSWORD:-admin123}" # Pobierane ze zmiennej środowiskowej

  authorizationStrategy:
    logged-in-users-can-do-anything:
      allowAnonymousRead: false

# Globalny katalog narzędzi (Global Tool Configuration)
tool:
  maven:
    installations:
      - name: "Maven 3.8.8"
        home: "/usr/share/maven" # Ścieżka systemowa lub automatyczny instalator
  nodeJS:
    installations:
      - name: "NodeJS 20"
        installers:
          - nodeJSInstaller:
              id: "20.11.0"
  git:
    installations:
      - name: "Default"
        home: "git"

# Definicja zadań (Jobs) przy użyciu wbudowanej integracji z Job DSL
jobs:
  - script: >
      pipelineJob('node-api-production-pipeline') {
        description('Automatyczny pipeline CI/CD dla aplikacji Node.js i MongoDB')
        
        properties {
          buildDiscarder {
            strategy {
              logRotator {
                numToKeep('10')
                artifactNumToKeep('5')
              }
            }
          }
        }
        
        definition {
          cps {
            script('''
              pipeline {
                  agent any
                  stages {
                      stage('Checkout') {
                          steps {
                              echo 'Pobieranie kodu źródłowego...'
                          }
                      }
                      stage('Build & Test') {
                          steps {
                              echo 'Instalacja zależności i uruchamianie testów...'
                              sh 'node -v'
                          }
                      }
                      stage('Docker Build') {
                          steps {
                              echo 'Budowanie obrazu kontenera...'
                          }
                      }
                  }
              }
            '''.stripIndent())
          }
        }
      }

unclassified:
  location:
    url: "http://localhost:8080/"